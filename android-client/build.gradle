plugins {
    id 'com.android.application' version '8.5.2' apply false
}

// AndroidX currently brings Kotlin runtime modules at different versions. The
// app itself is Java-only, so keep one consistent Kotlin runtime on the APK
// classpath and avoid duplicate jdk7/jdk8 classes during D8 duplicate checks.
subprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '1.8.22'
            }
        }
    }
}
