services:
  tvwall:
    build:
      context: .
      dockerfile: Dockerfile
    image: tvwall:local
    container_name: tvwall
    restart: unless-stopped
    init: true
    ports:
      - "${TVWALL_PORT:-8088}:8088"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/api/devices"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
