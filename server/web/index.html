<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TV Wall 管理台</title>
  <style>
    :root { --bg:#0b1012; --panel:#151d21; --panel2:#1b262b; --line:#2b3a41; --text:#e8f0f3; --muted:#8fa1a9; --accent:#5ee0b2; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow-x:auto; color:var(--text); background:var(--bg); font:14px/1.5 Inter,system-ui,"Segoe UI",sans-serif; }
    header { height:68px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:#12181b; }
    h1 { margin:0; font-size:20px; letter-spacing:.2px; } h1 span { margin-left:8px; color:var(--muted); font-size:12px; font-weight:400; }
    button { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:9px 14px; cursor:pointer; }
    button:hover { border-color:#5c717d; } button.primary { color:#07251c; background:var(--accent); border-color:var(--accent); font-weight:700; }
    button.danger { color:#ffd5d5; border-color:#714747; background:#251a1d; } button.danger:hover { border-color:#b56868; background:#382126; }
    main { padding:24px 28px 40px; }
    .toolbar { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
    .hint { color:var(--muted); margin:0 0 16px; }
    .status { margin-left:auto; color:var(--accent); font-size:12px; }
    .wall-wrap { overflow:visible; padding:4px 2px 12px; }
    .wall { --cols:3; --gap:18px; --tile-width:clamp(260px,calc((100vw - 128px) / 3),460px); display:grid; grid-template-columns:repeat(var(--cols),var(--tile-width)); grid-auto-rows:auto; align-content:start; gap:var(--gap); width:max-content; min-width:0; max-width:none; min-height:318px; margin:0; padding:18px; border:1px solid var(--line); border-radius:10px; background:linear-gradient(135deg,#101719,#0c1214); box-shadow:inset 0 0 0 1px #071012; }
    .wall.one { width:100%; min-width:0; height:calc(100vh - 190px); min-height:320px; margin:0; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr); grid-auto-rows:auto; align-content:stretch; justify-content:stretch; }
    .wall.one .tile { width:100%; height:100%; min-width:0; min-height:0; aspect-ratio:auto; }
    .wall.two { --cols:2; justify-content:start; }
    .wall.fit { width:100%; min-width:0; height:calc(100vh - 190px); min-height:320px; grid-template-columns:repeat(var(--cols),minmax(0,1fr)); grid-template-rows:repeat(var(--rows),minmax(0,1fr)); grid-auto-rows:auto; align-content:stretch; justify-content:stretch; }
    .wall.fit .tile { width:100%; height:100%; min-width:0; min-height:0; aspect-ratio:auto; }
    .tile { position:relative; width:var(--tile-width); aspect-ratio:16/9; min-height:120px; overflow:hidden; display:flex; align-items:center; justify-content:center; border:1px solid #3c515a; border-radius:7px; background:linear-gradient(145deg,#24383f,#172429); box-shadow:0 8px 18px #0006; cursor:grab; user-select:none; touch-action:none; will-change:transform; transition:box-shadow .15s,opacity .15s,border-color .15s,transform .28s cubic-bezier(.2,1.35,.35,1); }
    .tile-preview { position:absolute; inset:0; background-position:center; background-size:cover; background-repeat:no-repeat; opacity:.92; }
    .tile-preview::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg,#07101255 0%,#07101210 45%,#07101255 100%); }
    .tile:hover { border-color:#76b5a2; box-shadow:0 10px 24px #0009; }
    .tile.offline-tile { filter:grayscale(.8); opacity:.58; border-color:#4d5b61; }
    .tile.offline-tile .tile-preview { opacity:.38; }
    .tile-status { position:absolute; top:10px; right:10px; z-index:2; padding:2px 7px; border:1px solid #286f5a; border-radius:999px; color:#9df1cf; background:#123328dd; font-size:11px; line-height:1.3; }
    .tile-status.offline { border-color:#58636a; color:#c2c9cc; background:#2a3033dd; }
    .tile.dragging { cursor:grabbing; opacity:.84; border-color:var(--accent); box-shadow:0 0 0 2px #5ee0b255,0 12px 28px #000b; z-index:5; transition:none; }
    .tile.collision { border-color:#f0b35a; box-shadow:0 0 0 2px #f0b35a66,0 0 26px #f0b35a66; animation:collision-pulse .35s ease-in-out infinite alternate; }
    .tile.collision-hit { animation:collision-hit .42s cubic-bezier(.2,1.5,.4,1); }
    @keyframes collision-pulse { from { transform:scale(1); } to { transform:scale(1.025); } }
    @keyframes collision-hit { 0% { transform:scale(1); } 35% { transform:scale(.94) rotate(-1deg); } 70% { transform:scale(1.06) rotate(1deg); } 100% { transform:scale(1); } }
    .tile-title { position:absolute; top:12px; left:14px; z-index:1; max-width:calc(100% - 28px); overflow:hidden; padding:3px 7px; color:#e8f0f3; background:#071012aa; border:1px solid #ffffff1c; border-radius:4px; text-align:left; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:600; }
    .tile-info-panel { position:absolute; left:0; right:0; bottom:0; z-index:3; max-height:82%; overflow:auto; padding:9px 11px 10px; color:#dce8eb; background:#071012ee; border-top:1px solid #5ee0b277; opacity:0; transform:translateY(102%); transition:transform .2s cubic-bezier(.2,1.2,.35,1),opacity .16s; pointer-events:none; }
    .tile:hover .tile-info-panel, .tile:focus-within .tile-info-panel { opacity:1; transform:translateY(0); pointer-events:auto; }
    .info-line { display:flex; gap:6px; min-width:0; margin:2px 0; color:#bdcdd2; font-size:11px; line-height:1.35; }
    .info-line b { flex:0 0 auto; color:#7f969e; font-weight:500; }
    .info-line span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .tile-actions { display:flex; gap:7px; width:auto; margin-top:8px; }
    .tile-actions button { flex:1; padding:5px 7px; font-size:12px; }
    .holding-panel { margin-top:16px; padding:14px; border:1px dashed #3b535b; border-radius:10px; background:linear-gradient(135deg,#111a1d,#0d1416); }
    .holding-head { display:flex; align-items:baseline; gap:12px; margin-bottom:12px; }
    .holding-head strong { font-size:14px; }
    .holding-head span { color:var(--muted); font-size:12px; }
    .holding-list { display:flex; flex-wrap:wrap; gap:12px; min-height:24px; }
    .holding-tile { width:clamp(190px,22vw,280px); min-height:0; aspect-ratio:16/9; }
    .holding-tile .tile-title { top:8px; left:9px; max-width:calc(100% - 18px); padding:2px 5px; font-size:12px; }
    .holding-tile .tile-info-panel { padding:7px 8px 8px; }
    .holding-tile .info-line { font-size:10px; }
    dialog { width:min(420px,calc(100% - 32px)); color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:0; }
    dialog::backdrop { background:#000b; } .dialog-head { padding:17px 20px; border-bottom:1px solid var(--line); font-weight:650; }
    form { padding:20px; } label { display:block; margin:0 0 14px; color:var(--muted); font-size:12px; } input { display:block; width:100%; margin-top:6px; padding:9px 10px; color:var(--text); background:#0f1417; border:1px solid var(--line); border-radius:5px; outline:none; font:inherit; } input:focus { border-color:var(--accent); }
    .dialog-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
    .toast { position:fixed; right:20px; bottom:20px; padding:11px 15px; color:#c9fff0; background:#153229; border:1px solid #3f5e53; border-radius:6px; opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; } .toast.show { opacity:1; transform:none; }
    @media (max-width:700px) { header { padding:0 16px; } main { padding:18px 16px 32px; } .wall.one { height:calc(100vh - 215px); } .tile-title { font-size:13px; } }
  </style>
</head>
<body>
  <header><h1>TV Wall <span>正式管理后台</span></h1><span class="status">生产环境</span></header>
  <main>
    <div class="toolbar"><button class="primary" onclick="openAdd()">添加电视</button><button onclick="scan()">扫描局域网</button><button onclick="loadDevices()">刷新</button><button onclick="resetLayout()">恢复自动布局</button><span class="status"><span id="counts">在线0台，离线0台</span><span id="statusMessage">正在加载…</span></span></div>
    <p class="hint">拖动大屏可调整对应位置，松开后自动吸附到等宽、等高网格。扫描到的新设备会先进入待放置区，拖动后加入展示布局；新增、编辑、删除和截图请求直接作用于正式设备。</p>
    <div class="wall-wrap"><section id="wall" class="wall" aria-label="正式电视墙"></section></div>
    <section id="holdingPanel" class="holding-panel" hidden aria-label="待放置电视"><div class="holding-head"><strong>待放置电视</strong><span>编辑名称后，拖到上方展示布局中</span></div><div id="holding" class="holding-list"></div></section>
  </main>
  <dialog id="editor"><div class="dialog-head" id="dialogTitle">添加电视</div><form onsubmit="saveScreen(event)"><input type="hidden" id="deviceId"><label>设备名称<input id="screenName" required maxlength="32" placeholder="例如：一楼大厅"></label><label id="ipField">客户端固定 IP（用于首次绑定）<input id="ip" required placeholder="例如：192.0.2.107" pattern="[0-9a-fA-F:.]+"></label><label>展示网址<input id="screenUrl" type="url" placeholder="http://intranet.example/dashboard"></label><label>关键帧间隔（秒）<input id="refreshSeconds" type="number" min="3" value="5"></label><div class="dialog-actions"><button type="button" onclick="editor.close()">取消</button><button class="primary">保存配置</button></div></form></dialog>
  <div id="toast" class="toast"></div>
  <script>
    const wall=document.getElementById('wall'); const holdingEl=document.getElementById('holding'); const holdingPanel=document.getElementById('holdingPanel'); const editor=document.getElementById('editor'); const toastEl=document.getElementById('toast'); const countsEl=document.getElementById('counts'); const statusEl=document.getElementById('statusMessage');
    const layoutKey='tvwall-production-layout-v1'; const holdingKey='tvwall-production-holding-v1'; const knownKey='tvwall-production-known-v1'; let devices=[]; let screens=[]; let holding=[]; let editingId=''; let dragging=null;
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function toast(s){toastEl.textContent=s;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2200)}
    function fitKind(){if(screens.length===4){const cells=new Set(screens.map(s=>`${s.col}:${s.row}`));if(cells.size===4&&[...cells].every(k=>['1:1','2:1','1:2','2:2'].includes(k)))return'fit-four'}return''}
    function layoutColumns(){const mode=fitKind();if(screens.length===1)return 1;if(mode==='fit-four')return 2;const used=screens.reduce((m,s)=>Math.max(m,s.col||1),1);return screens.length===2?used:Math.max(3,used)}
    function layoutRows(){const mode=fitKind();if(screens.length===1||mode==='fit-four')return mode==='fit-four'?2:1;return Math.max(1,screens.reduce((m,s)=>Math.max(m,s.row||1),1))}
    function firstFreeCell(cols=Math.max(layoutColumns(),screens.length===1?2:1)){const used=new Set(screens.map(s=>`${s.col}:${s.row}`));for(let row=1;;row++)for(let col=1;col<=cols;col++)if(!used.has(`${col}:${row}`))return{col,row}}
    function positions(){try{return JSON.parse(localStorage.getItem(layoutKey)||'{}')}catch(_){return{}}}
    function holdingIds(){try{const ids=JSON.parse(localStorage.getItem(holdingKey)||'[]');return new Set(Array.isArray(ids)?ids:[])}catch(_){return new Set()}}
    function knownIds(){try{const ids=JSON.parse(localStorage.getItem(knownKey)||'[]');return new Set(Array.isArray(ids)?ids:[])}catch(_){return new Set()}}
    function saveKnownIds(ids){localStorage.setItem(knownKey,JSON.stringify([...ids]))}
    function saveHoldingIds(){localStorage.setItem(holdingKey,JSON.stringify(holding.map(s=>s.id)))}
    function savePositions(){const out={};screens.forEach(s=>{out[s.id]={col:s.col,row:s.row}});localStorage.setItem(layoutKey,JSON.stringify(out))}
    function normalizePositions(){if(screens.length===1){screens[0].col=1;screens[0].row=1;return}const cols=layoutColumns(),used=new Set();screens.forEach(s=>{if(s.col<1||s.row<1||used.has(`${s.col}:${s.row}`)){const cell=firstFreeCell(cols);s.col=cell.col;s.row=cell.row}used.add(`${s.col}:${s.row}`)})}
    async function api(path,opt={}){const r=await fetch(path,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
    function card(s,held=false){const online=Boolean(s.online);return `<article class="tile${held?' holding-tile':''}${online?'':' offline-tile'}" data-id="${esc(s.id)}"${held?'':' style="grid-column:'+s.col+';grid-row:'+s.row+'"'} tabindex="0"><div class="tile-preview"></div><div class="tile-title">${esc(s.name||'未命名电视')}</div><span class="tile-status ${online?'online':'offline'}">${online?'在线':'离线'}</span><div class="tile-info-panel"><div class="info-line"><b>设备 ID</b><span title="${esc(s.id)}">${esc(s.id)}</span></div><div class="info-line"><b>IP 地址</b><span>${esc(s.ip||'等待客户端心跳')}</span></div><div class="info-line"><b>链接</b><span title="${esc(s.url||'未配置网址')}">${esc(s.url||'未配置网址')}</span></div><div class="info-line"><b>关键帧</b><span>${esc(ago(s.last_frame_at))}</span></div><div class="info-line"><b>心跳</b><span>${esc(ago(s.last_seen))}</span></div><div class="tile-actions"><button data-action="edit">编辑配置</button><button data-action="shot">获取截图</button><button class="danger" data-action="delete">删除</button></div></div></article>`}
    async function loadDevices(){try{const j=await api('/api/devices');const all=j.devices||[];devices=all;const online=all.filter(d=>d.online).length;countsEl.textContent=`在线${online}台，离线${all.length-online}台`;const held=holdingIds(),known=knownIds(),allIds=new Set(all.map(d=>d.id)),firstSync=localStorage.getItem(knownKey)===null;if(firstSync){allIds.forEach(id=>known.add(id))}else{all.filter(d=>!known.has(d.id)).forEach(d=>{known.add(d.id);held.add(d.id)})}saveKnownIds(known);const saved=positions();holding=all.filter(d=>held.has(d.id));const heldIds=new Set(holding.map(d=>d.id));holding=holding.map(d=>({...d,col:1,row:1}));screens=all.filter(d=>!heldIds.has(d.id)).map((d,i)=>{const p=saved[d.id];return {...d,col:p?.col??((i%3)+1),row:p?.row??(Math.floor(i/3)+1)}});normalizePositions();saveHoldingIds();render();statusEl.textContent=holding.length?`${holding.length} 台待放置`:''}catch(e){statusEl.textContent='加载失败';toast('加载失败：'+e.message)}}
    function render(reflow=false){if(reflow){screens.forEach((s,i)=>{const cols=Math.max(3,layoutColumns());s.col=(i%cols)+1;s.row=Math.floor(i/cols)+1});savePositions()}else normalizePositions();const mode=fitKind(),kind=screens.length===1?'one':mode?`fit ${mode}`:screens.length===2?'two':'many';wall.className=`wall ${kind}`;wall.style.setProperty('--cols',layoutColumns());wall.style.setProperty('--rows',layoutRows());wall.innerHTML=screens.length?screens.map(s=>card(s)).join(''):'<div class="empty">暂无展示设备</div>';holdingPanel.hidden=holding.length===0;holdingEl.innerHTML=holding.map(s=>card(s,true)).join('');[...screens,...holding].forEach(s=>{if(!s.last_frame)return;const tile=tileById(s.id);if(tile)tile.querySelector('.tile-preview').style.backgroundImage=`url("${s.last_frame}")`})}
    function ago(v){if(!v)return'从未';const n=Math.max(0,Date.now()-new Date(v).getTime())/1000;return n<60?Math.floor(n)+'秒前':n<3600?Math.floor(n/60)+'分钟前':Math.floor(n/3600)+'小时前'}
    function tileById(id){return document.querySelector(`[data-id="${CSS.escape(id)}"]`)} function screenById(id){return screens.find(s=>s.id===id)||holding.find(s=>s.id===id)}
    function openAdd(){editingId='';document.getElementById('dialogTitle').textContent='添加电视';document.getElementById('deviceId').value='';document.getElementById('screenName').value='';document.getElementById('ip').value='';document.getElementById('screenUrl').value='';document.getElementById('refreshSeconds').value=5;document.getElementById('ipField').style.display='block';document.getElementById('ip').required=true;editor.showModal();setTimeout(()=>document.getElementById('screenName').focus(),0)}
function openEdit(id){const s=screenById(id);if(!s)return;editingId=id;document.getElementById('dialogTitle').textContent='编辑电视';document.getElementById('deviceId').value=s.id;document.getElementById('screenName').value=s.name||'';document.getElementById('screenUrl').value=s.url||'';document.getElementById('refreshSeconds').value=s.refresh_seconds||5;document.getElementById('ipField').style.display='none';document.getElementById('ip').required=false;editor.showModal();setTimeout(()=>document.getElementById('screenName').focus(),0)}
    async function saveScreen(e){e.preventDefault();const id=document.getElementById('deviceId').value.trim(),name=document.getElementById('screenName').value.trim(),url=document.getElementById('screenUrl').value.trim(),refresh_seconds=Number(document.getElementById('refreshSeconds').value)||5;try{if(id){await api('/api/devices/'+encodeURIComponent(id)+'/config',{method:'PUT',body:JSON.stringify({name,url,refresh_seconds})})}else{const created=await api('/api/devices',{method:'POST',body:JSON.stringify({name,ip:document.getElementById('ip').value.trim(),url,refresh_seconds})});const known=knownIds();known.add(created.id);saveKnownIds(known);if(screens.length<2){const saved=positions();saved[created.id]=firstFreeCell();localStorage.setItem(layoutKey,JSON.stringify(saved))}else{const ids=holdingIds();ids.add(created.id);localStorage.setItem(holdingKey,JSON.stringify([...ids]))}}editor.close();toast(id?'配置已保存':'电视已添加');await loadDevices()}catch(x){toast('保存失败：'+x.message)}}
    async function deleteScreen(id){const s=screenById(id);if(!s||!confirm(`确定删除“${s.name}”？`))return;try{await api('/api/devices/'+encodeURIComponent(id),{method:'DELETE'});const ids=holdingIds();ids.delete(id);localStorage.setItem(holdingKey,JSON.stringify([...ids]));const known=knownIds();known.delete(id);saveKnownIds(known);toast('设备已删除');loadDevices()}catch(e){toast('删除失败：'+e.message)}}

    async function scan(){const cidr=prompt('输入要扫描的 IPv4 网段（例如 192.0.2.0/24）','192.0.2.0/24');if(!cidr)return;try{const j=await api('/api/scan?cidr='+encodeURIComponent(cidr));if(!j.count){toast('未发现客户端');return}const known=new Set(devices.map(d=>d.id));for(const d of j.devices){if(!known.has(d.id))await api('/api/devices',{method:'POST',body:JSON.stringify({id:d.id,name:d.name,ip:d.ip})})}toast('发现 '+j.count+' 台客户端');await loadDevices()}catch(e){toast('扫描失败：'+e.message)}}
    function resetLayout(){localStorage.removeItem(layoutKey);loadDevices();toast('已恢复自动布局')}
    function metrics(){const cs=getComputedStyle(wall),rect=wall.getBoundingClientRect(),border=parseFloat(cs.borderLeftWidth)||0,padX=parseFloat(cs.paddingLeft)||0,padY=parseFloat(cs.paddingTop)||0,gap=parseFloat(cs.getPropertyValue('--gap'))||0,sample=wall.querySelector('.tile:not(.dragging)')||wall.querySelector('.tile');const w=sample?.getBoundingClientRect().width||dragging.gridWidth||dragging.tileWidth,h=sample?.getBoundingClientRect().height||dragging.gridHeight||dragging.tileHeight;return{rect,border,padX,padY,gap,w,h}}
    function autoScroll(e){const edge=72,step=24;let dx=0,dy=0;if(e.clientX>window.innerWidth-edge)dx=step;else if(e.clientX<edge&&window.scrollX>0)dx=-step;if(e.clientY>window.innerHeight-edge)dy=step;else if(e.clientY<edge&&window.scrollY>0)dy=-step;if(!dx&&!dy)return;window.scrollBy(dx,dy);const root=document.documentElement;if(dx>0){const maxScrollX=Math.max(0,root.scrollWidth-window.innerWidth-4);if(window.scrollX>=maxScrollX){const current=parseInt(getComputedStyle(wall).getPropertyValue('--cols'))||layoutColumns();wall.style.setProperty('--cols',current+1)}}if(dy>0&&!wall.classList.contains('fit')){const maxScrollY=Math.max(0,root.scrollHeight-window.innerHeight-4);if(window.scrollY>=maxScrollY){const cs=getComputedStyle(wall),gap=parseFloat(cs.getPropertyValue('--gap'))||18,extra=(dragging.gridHeight||220)+gap;wall.style.minHeight=`${Math.ceil(wall.getBoundingClientRect().height+extra)}px`}}}
    function clearDragSpace(){wall.style.removeProperty('min-height')}
    function ensureDropRows(row,h,gap){if(wall.classList.contains('fit'))return;const cs=getComputedStyle(wall),borderY=(parseFloat(cs.borderTopWidth)||0)+(parseFloat(cs.borderBottomWidth)||0),padY=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0),needed=borderY+padY+row*h+Math.max(0,row-1)*gap;if(needed>wall.getBoundingClientRect().height)wall.style.minHeight=`${Math.ceil(needed)}px`}
    function targetCell(e){const m=metrics(),pageX=e.clientX+window.scrollX,pageY=e.clientY+window.scrollY,wallLeft=m.rect.left+window.scrollX,wallTop=m.rect.top+window.scrollY,x=pageX-wallLeft-m.border-m.padX-dragging.offsetX+m.w/2,y=pageY-wallTop-m.border-m.padY-dragging.offsetY+m.h/2,col=Math.max(1,Math.floor(x/(m.w+m.gap))+1),row=Math.max(1,Math.floor(y/(m.h+m.gap))+1);if(col>layoutColumns()){wall.style.setProperty('--cols',col);dragging.capacity=col}ensureDropRows(row,m.h,m.gap);return{col,row}}
    async function shotScreen(id){try{await api('/api/devices/'+encodeURIComponent(id)+'/command',{method:'POST',body:JSON.stringify({type:'screenshot'})});toast('已请求截图，正在自动刷新');setTimeout(()=>loadDevices(),2500);setTimeout(()=>loadDevices(),5000)}catch(e){toast('请求截图失败：'+e.message)}}
    function clickCard(e){const button=e.target.closest('button'),tile=e.target.closest('.tile');if(!tile||!button||dragging)return;const id=tile.dataset.id;if(button.dataset.action==='edit')openEdit(id);if(button.dataset.action==='shot')shotScreen(id);if(button.dataset.action==='delete')deleteScreen(id)}
    wall.addEventListener('click',clickCard);holdingEl.addEventListener('click',clickCard);
    function clearHeldDragStyles(tile){if(!tile)return;['position','left','top','width','height','zIndex'].forEach(k=>tile.style.removeProperty(k))}
    function beginDrag(e,source){const tile=e.target.closest('.tile');if(!tile||e.target.closest('button')||(source==='main'&&screens.length===1))return;const s=screenById(tile.dataset.id);if(!s)return;const r=tile.getBoundingClientRect(),sample=wall.querySelector('.tile:not(.dragging)')||wall.querySelector('.tile'),gridWidth=sample?.getBoundingClientRect().width||r.width,gridHeight=sample?.getBoundingClientRect().height||r.height;dragging={id:s.id,source,mode:fitKind(),pointerId:e.pointerId,offsetX:e.clientX-r.left,offsetY:e.clientY-r.top,startX:e.clientX,startY:e.clientY,startPageX:e.clientX+window.scrollX,startPageY:e.clientY+window.scrollY,tileWidth:r.width,tileHeight:r.height,gridWidth,gridHeight,original:{col:s.col,row:s.row},target:{col:s.col||1,row:s.row||1},moved:false,collisionId:''};if(source==='holding'){tile.style.position='fixed';tile.style.left=`${r.left}px`;tile.style.top=`${r.top}px`;tile.style.width=`${r.width}px`;tile.style.height=`${r.height}px`;tile.style.zIndex='20'}tile.classList.add('dragging');tile.setPointerCapture(e.pointerId);statusEl.textContent='正在移动，松开后自动对齐'}
    wall.addEventListener('pointerdown',e=>beginDrag(e,'main'));holdingEl.addEventListener('pointerdown',e=>beginDrag(e,'holding'));
    document.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==dragging.pointerId)return;autoScroll(e);const tile=tileById(dragging.id);if(!tile)return;const pageX=e.clientX+window.scrollX,pageY=e.clientY+window.scrollY,dx=pageX-dragging.startPageX,dy=pageY-dragging.startPageY;if(Math.hypot(dx,dy)>3)dragging.moved=true;tile.style.transform='';const base=tile.getBoundingClientRect(),followX=e.clientX-dragging.offsetX-base.left,followY=e.clientY-dragging.offsetY-base.top;tile.style.transform=`translate(${followX}px,${followY}px) scale(1.045) rotate(${Math.max(-3,Math.min(3,dx/80))}deg)`;const next=targetCell(e);dragging.target=next;const other=screens.find(x=>x.id!==dragging.id&&x.col===next.col&&x.row===next.row);if(other?.id!==dragging.collisionId){if(dragging.collisionId){const old=tileById(dragging.collisionId);if(old)old.classList.remove('collision')}dragging.collisionId=other?.id||'';if(other){const otherEl=tileById(other.id);if(otherEl)otherEl.classList.add('collision')}}});
    function pulse(tile){if(!tile)return;tile.classList.remove('collision-hit');void tile.offsetWidth;tile.classList.add('collision-hit');setTimeout(()=>tile.classList.remove('collision-hit'),450)}
    function clearCollision(id){if(!id)return;const old=tileById(id);if(old)old.classList.remove('collision')}
    function stopDrag(e,commit=true){if(!dragging||e.pointerId!==dragging.pointerId)return;const current=dragging,tile=tileById(current.id);clearCollision(current.collisionId);clearDragSpace();if(current.source==='holding'){const held=holding.find(x=>x.id===current.id);if(held&&commit&&current.moved){const target=current.target,other=screens.find(x=>x.col===target.col&&x.row===target.row);holding=holding.filter(x=>x.id!==held.id);held.col=target.col;held.row=target.row;if(other){const targetIndex=screens.findIndex(x=>x.id===other.id);other.col=held.col||1;other.row=held.row||1;holding.push(other);if(targetIndex>=0)screens[targetIndex]=held;else screens.push(held)}else screens.push(held);saveHoldingIds();savePositions();render();toast(other?'已放置并将原电视移入待放置区':'已放置到展示布局')}else if(tile){tile.classList.remove('dragging');tile.style.transform=''}clearHeldDragStyles(tile);dragging=null;return}
      const s=screenById(current.id);if(tile&&s){const target=commit&&current.moved?current.target:current.original,other=screens.find(x=>x.id!==s.id&&x.col===target.col&&x.row===target.row);if(other&&commit&&current.moved){const old={col:s.col,row:s.row};other.col=old.col;other.row=old.row;const otherEl=tileById(other.id);if(otherEl){otherEl.style.gridColumn=other.col;otherEl.style.gridRow=other.row;pulse(otherEl)}}s.col=target.col;s.row=target.row;tile.style.gridColumn=s.col;tile.style.gridRow=s.row;tile.classList.remove('dragging');wall.style.setProperty('--cols',layoutColumns());const modeChanged=fitKind()!==current.mode;requestAnimationFrame(()=>{tile.style.transform=''});if(commit&&current.moved){savePositions();if(modeChanged)render();toast('位置已对齐')}}dragging=null;statusEl.textContent=`${screens.length} 台展示中${holding.length?`，${holding.length} 台待放置`:''}`}
    document.addEventListener('pointerup',e=>stopDrag(e,true));document.addEventListener('pointercancel',e=>stopDrag(e,false));loadDevices();setInterval(()=>{if(!dragging)loadDevices()},15000);
  </script>
